<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PathCopy Advanced</title>
<!-- Дизайн-код плагинов B&A: ba.css / ba.js лежат рядом, правила — design/designcode.md в ralncs -->
<link rel="stylesheet" href="ba.css">
<script src="i18n.js"></script>
<style>
  /* Компактная утилитарная панель: группы полей друг под другом */
  #wrap { padding: 4px 14px 14px; }
  .group { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px 10px; margin-top: 8px; }
  .group h3 { margin: 0 0 6px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .row label.name { flex: 0 0 118px; color: #555; }
  .row select, .row input[type="text"] { flex: 1; min-width: 0; padding: 4px 8px; }
  .row input[type="text"].short { flex: 0 0 90px; }
  .row input[type="text"].tiny { flex: 0 0 58px; }
  .row .unit { color: #888; font-size: 11px; }
  .row label.opt { padding: 2px 0; }
  .quick { display: flex; gap: 4px; }
  .quick button { padding: 3px 8px; font-size: 12px; }
  .row label.name.narrow { flex-basis: 96px; }
  .hint { color: #888; font-size: 11px; line-height: 1.4; margin-top: 4px; }
  #status { min-height: 30px; }
  #status .stage { color: #1c1c1c; }
  .hidden { display: none !important; }
  .row.muted-row { opacity: .45; }
  .row.muted-row select, .row.muted-row input { pointer-events: none; }
  .sub { color: #888; font-size: 11px; padding: 0 0 2px 126px; line-height: 1.35; }
  .sub.narrow { padding-left: 104px; }
</style>
</head>
<body>
  <header>
    <span class="code">PathCopy Advanced</span>
    <span class="spacer"></span>
    <button id="btnReset" data-t="btn_reset" data-t-title="t_reset"></button>
  </header>
  <div id="status"><span class="stage">…</span></div>

  <div id="wrap">
    <div class="group">
      <h3 data-t="g_distribution"></h3>
      <div class="row">
        <label class="name" for="distribution" data-t="f_mode"></label>
        <select id="distribution" data-key="distribution"></select>
      </div>
      <div class="row" id="rowSpacing">
        <label class="name" for="spacing" data-t="f_spacing"></label>
        <input type="text" id="spacing" data-key="spacing" class="short">
        <span class="unit" id="spacingHint"></span>
      </div>
      <div class="row" id="rowCount">
        <label class="name" for="count" data-t="f_count"></label>
        <input type="text" id="count" data-key="count" class="short">
      </div>
      <div class="row" id="rowAlign">
        <label class="name" for="align" data-t="f_align"></label>
        <select id="align" data-key="align"></select>
      </div>
      <div class="row">
        <label class="name" for="start_offset" data-t="f_offsets"></label>
        <input type="text" id="start_offset" data-key="start_offset" class="short" data-t-title="t_start_offset">
        <input type="text" id="end_offset" data-key="end_offset" class="short" data-t-title="t_end_offset">
        <span class="unit" data-t="u_startend"></span>
      </div>
      <div class="row">
        <label class="opt"><input type="checkbox" id="skip_seam" data-key="skip_seam"> <span data-t="c_skip_seam"></span></label>
      </div>
    </div>

    <div class="group">
      <h3 data-t="g_orientation"></h3>
      <div class="row">
        <label class="name" for="orientation" data-t="f_rotation"></label>
        <select id="orientation" data-key="orientation"></select>
      </div>
      <div class="row">
        <label class="name narrow" data-t="f_relative"></label>
        <span class="quick">
          <button data-angle="0" data-t="b_along" data-t-title="t_along"></button>
          <button data-angle="90" data-t="b_across" data-t-title="t_across"></button>
        </span>
        <input type="text" id="extra_angle" data-key="extra_angle" class="tiny" data-t-title="t_extra_angle">
        <span class="unit">°</span>
      </div>
      <div class="row">
        <label class="name" for="anchor" data-t="f_anchor"></label>
        <select id="anchor" data-key="anchor"></select>
      </div>
      <div class="row" id="rowFacing">
        <label class="name" for="facing" data-t="f_facing"></label>
        <select id="facing" data-key="facing" data-t-title="t_facing"></select>
      </div>
      <div class="sub" id="facingHint"></div>
      <div class="row">
        <label class="opt"><input type="checkbox" id="reverse_path" data-key="reverse_path"> <span data-t="c_reverse"></span></label>
      </div>
      <div class="row">
        <label class="opt"><input type="checkbox" id="alternate_flip" data-key="alternate_flip"> <span data-t="c_flip"></span></label>
      </div>
      <div class="row">
        <label class="name" for="nudge_angle" data-t="f_nudge"></label>
        <input type="text" id="nudge_angle" data-key="nudge_angle" class="tiny" data-t-title="t_nudge">
        <span class="unit">°</span>
        <button id="btnClearNudges" data-t="b_clear" data-t-title="t_clear"></button>
      </div>
      <div class="sub" id="nudgeHint"></div>
      <div class="row">
        <label class="name" for="offset_lateral" data-t="f_offset"></label>
        <input type="text" id="offset_lateral" data-key="offset_lateral" class="short" data-t-title="t_offset_side">
        <input type="text" id="offset_vertical" data-key="offset_vertical" class="short" data-t-title="t_offset_up">
        <span class="unit" data-t="u_sideup"></span>
      </div>
    </div>

    <div class="group">
      <h3><label class="opt"><input type="checkbox" id="jitter" data-key="jitter"> <span data-t="g_jitter"></span></label></h3>
      <div id="jitterBody">
        <div class="row">
          <label class="name" for="jitter_angle" data-t="f_j_angle"></label>
          <input type="text" id="jitter_angle" data-key="jitter_angle" class="short"><span class="unit">°</span>
          <label class="name" for="jitter_scale" style="flex-basis:auto" data-t="f_j_scale"></label>
          <input type="text" id="jitter_scale" data-key="jitter_scale" class="short"><span class="unit">%</span>
        </div>
        <div class="row">
          <label class="name" for="jitter_along" data-t="f_j_shift"></label>
          <input type="text" id="jitter_along" data-key="jitter_along" class="short" data-t-title="t_j_along">
          <input type="text" id="jitter_lateral" data-key="jitter_lateral" class="short" data-t-title="t_j_side">
          <input type="text" id="jitter_vertical" data-key="jitter_vertical" class="short" data-t-title="t_j_up">
        </div>
        <div class="row">
          <label class="name" for="seed" data-t="f_seed"></label>
          <input type="text" id="seed" data-key="seed" class="short" data-t-title="t_seed">
          <span class="unit" data-t="u_jitter"></span>
        </div>
      </div>
    </div>

    <div class="group">
      <h3><label class="opt"><input type="checkbox" id="rail" data-key="rail"> <span data-t="g_rail"></span></label></h3>
      <div id="railBody">
        <div class="row">
          <label class="name" for="rail_shape" data-t="f_rail_shape"></label>
          <select id="rail_shape" data-key="rail_shape"></select>
        </div>
        <div class="row">
          <label class="name" for="rail_width" data-t="f_rail_size"></label>
          <input type="text" id="rail_width" data-key="rail_width" class="short" data-t-title="t_rail_width">
          <input type="text" id="rail_height" data-key="rail_height" class="short" data-t-title="t_rail_height">
          <span class="unit" data-t="u_wh"></span>
        </div>
        <div class="row">
          <label class="name" for="rail_align" data-t="f_rail_align"></label>
          <select id="rail_align" data-key="rail_align" data-t-title="t_rail_align"></select>
        </div>
        <div class="sub" id="railAlignHint"></div>
        <div class="row">
          <label class="name" for="rail_extend" data-t="f_rail_extend"></label>
          <input type="text" id="rail_extend" data-key="rail_extend" class="short" data-t-title="t_rail_extend">
        </div>
        <div class="row">
          <label class="name" for="rail_rise" data-t="f_rail_rise"></label>
          <input type="text" id="rail_rise" data-key="rail_rise" class="short" data-t-title="t_rail_rise">
        </div>
        <div class="sub" data-t="hint_rail_rise"></div>
      </div>
    </div>

    <div class="group">
      <h3 data-t="g_result"></h3>
      <div class="row">
        <label class="name" for="tag_name" data-t="f_tag"></label>
        <input type="text" id="tag_name" data-key="tag_name" data-t-ph="ph_tag">
      </div>
      <div class="row">
        <label class="opt"><input type="checkbox" id="group_result" data-key="group_result"> <span data-t="c_group"></span></label>
      </div>
    </div>

    <div class="hint" data-t="foot"></div>
  </div>
  <div id="toast"></div>

  <script src="ba.js"></script>
  <script>
  (function () {
    var pca = {};
    var byId = function (id) { return document.getElementById(id); };
    var ready = false;

    // Заполнение селектов приходит из Ruby вместе с настройками: один источник подписей.
    function fillSelect(sel, options, value) {
      if (sel.dataset.filled !== '1') {
        sel.innerHTML = options.map(function (o) {
          return '<option value="' + BA.esc(o[0]) + '">' + BA.esc(o[1]) + '</option>';
        }).join('');
        sel.dataset.filled = '1';
      }
      sel.value = value;
    }

    function send(key, value) {
      if (!ready) return;
      if (window.sketchup && sketchup.set) sketchup.set(key, String(value));
    }

    // Ruby -> панель. Значения выставляются без событий, чтобы не уйти в цикл.
    pca.update = function (s) {
      fillSelect(byId('distribution'), s.options.distribution, s.distribution);
      fillSelect(byId('orientation'), s.options.orientation, s.orientation);
      fillSelect(byId('align'), s.options.align, s.align);
      fillSelect(byId('anchor'), s.options.anchor, s.anchor);
      fillSelect(byId('facing'), s.options.facing, s.facing);
      fillSelect(byId('rail_shape'), s.options.rail_shape, s.rail_shape);
      fillSelect(byId('rail_align'), s.options.rail_align, s.rail_align);

      ['spacing', 'count', 'start_offset', 'end_offset', 'extra_angle', 'offset_lateral', 'offset_vertical',
       'jitter_angle', 'jitter_scale', 'jitter_along', 'jitter_lateral', 'jitter_vertical', 'seed',
       'rail_width', 'rail_height', 'rail_extend', 'rail_rise', 'nudge_angle', 'tag_name']
        .forEach(function (k) { if (document.activeElement !== byId(k)) byId(k).value = s[k]; });
      ['skip_seam', 'reverse_path', 'alternate_flip', 'jitter', 'group_result', 'rail']
        .forEach(function (k) { byId(k).checked = !!s[k]; });

      var d = s.distribution;
      byId('rowSpacing').classList.toggle('hidden', d === 'count' || d === 'vertices');
      byId('rowCount').classList.toggle('hidden', d !== 'count');
      byId('rowAlign').classList.toggle('hidden', d !== 'spacing');
      byId('spacingHint').textContent = d === 'fit' ? T.hint_fit : d === 'segments' ? T.hint_segments : '';
      byId('rowFacing').classList.toggle('hidden', s.orientation === 'none');
      byId('jitterBody').classList.toggle('hidden', !s.jitter);
      byId('railBody').classList.toggle('hidden', !s.rail);

      // Настройка действует только на замкнутом пути — говорим об этом прямо,
      // вместо того чтобы молча ничего не делать.
      var loop = !!s.path_closed;
      byId('rowFacing').classList.toggle('muted-row', !loop);
      byId('facingHint').textContent = loop ? T.hint_facing_loop
        : (s.has_path ? T.hint_facing_open : T.hint_facing_none);
      var nudged = Number(s.nudged || 0);
      byId('btnClearNudges').disabled = nudged === 0;
      byId('nudgeHint').textContent = nudged ? tf('hint_nudge_n', { n: nudged }) : T.hint_nudge;

      byId('railAlignHint').textContent = loop ? T.hint_rail_align_loop : T.hint_rail_align_open;

      document.querySelectorAll('.quick button').forEach(function (b) {
        b.classList.toggle('on', Number(b.dataset.angle) === Number(s.extra_angle));
      });
      byId('status').innerHTML = '<span class="stage">' + BA.esc(s.status) + '</span>';
      ready = true;
    };

    document.querySelectorAll('[data-key]').forEach(function (el) {
      var key = el.dataset.key;
      if (el.type === 'checkbox') {
        el.addEventListener('change', function () { send(key, el.checked); });
      } else if (el.tagName === 'SELECT') {
        el.addEventListener('change', function () { send(key, el.value); });
      } else {
        el.addEventListener('change', function () { send(key, el.value); });
        el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
      }
    });
    document.querySelectorAll('.quick button').forEach(function (b) {
      b.addEventListener('click', function () { send('extra_angle', b.dataset.angle); });
    });
    byId('btnReset').addEventListener('click', function () {
      if (window.sketchup && sketchup.reset) sketchup.reset();
    });
    byId('btnClearNudges').addEventListener('click', function () {
      if (window.sketchup && sketchup.clear_nudges) sketchup.clear_nudges();
    });

    applyI18n();
    window.pca = pca;
    if (window.sketchup && sketchup.ready) sketchup.ready();
  })();
  </script>
</body>
</html>
